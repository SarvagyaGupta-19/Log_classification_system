# Render.com Deployment Configuration
# This file tells Render how to build and run your app

# Build Command (runs during deployment)
build:
  - pip install --upgrade pip
  - pip install -r requirements.txt

# Start Command (runs to start your app)
start:
  - gunicorn server:app --workers 2 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --timeout 120
